<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提示詞優化器</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #fff;
      padding: 1rem;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
    }
    .mode-toggle {
      display: flex;
      gap: 0.5rem;
      background: #e5e7eb;
      padding: 0.25rem;
      border-radius: 0.5rem;
    }
    .mode-toggle label {
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 0.25rem;
      font-size: 0.875rem;
    }
    .mode-toggle input {
      display: none;
    }
    .mode-toggle input:checked + label {
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 80%;
      padding: 1rem;
      border-radius: 0.5rem;
    }
    .message.user {
      align-self: flex-end;
      background: #3b82f6;
      color: white;
    }
    .message.system {
      align-self: flex-start;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .artifact {
      margin-top: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .artifact-header {
      background: #f9fafb;
      padding: 0.5rem 1rem;
      font-weight: bold;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .artifact-body {
      padding: 1rem;
      background: #fafafa;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.875rem;
    }
    .step {
      margin-top: 1rem;
      border-top: 1px solid #e5e7eb;
      padding-top: 1rem;
    }
    .copy-btn {
      background: #fff;
      border: 1px solid #d1d5db;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .copy-btn:hover {
      background: #f3f4f6;
    }
    .input-area {
      padding: 1rem;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 0.5rem;
    }
    .input-area input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    .input-area button {
      padding: 0.75rem 1.5rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
    }
    .input-area button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <header>
    <h1>提示詞優化器</h1>
    <div class="mode-toggle">
      <input type="radio" id="mode-single" name="mode" value="single" checked>
      <label for="mode-single">單一提示詞</label>
      <input type="radio" id="mode-chain" name="mode" value="chain">
      <label for="mode-chain">提示詞鏈</label>
    </div>
  </header>

  <div id="chat-container">
    <div class="message system">
      歡迎！請告訴我您的需求，我會幫您擴寫成完整的提示詞。
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="wish-input" placeholder="例如：幫我寫一封請假信..." autocomplete="off">
    <button id="send-btn">送出</button>
  </div>

  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
